<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cacheta Online - Menu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0d4a22; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }
        .menu-container { background: rgba(0, 0, 0, 0.6); padding: 25px; border-radius: 10px; display: flex; flex-direction: column; gap: 15px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        h1 { font-size: 1.5rem; color: #f1c40f; margin-bottom: 5px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; text-align: left; font-size: 0.85rem; }
        input { padding: 10px; border-radius: 5px; border: none; font-size: 1rem; outline: none; color: #000; }
        button { padding: 12px; border: none; border-radius: 5px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-criar { background-color: #f1c40f; color: #000; }
        .btn-entrar { background-color: #27ae60; color: #fff; }
        .separador { border: 0; height: 1px; background: rgba(255,255,255,0.2); margin: 5px 0; }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>♠️ Cacheta Online ♣️</h1>
        
        <div class="input-group">
            <label for="inputNome">Seu Nome:</label>
            <input type="text" id="inputNome" placeholder="Ex: João" autocomplete="off">
        </div>

        <button id="btnCriarSala" class="btn-criar">Criar Nova Mesa 🎮</button>

        <hr class="separador">

        <div class="input-group">
            <label for="inputCodigoSala">Código da Mesa:</label>
            <input type="text" id="inputCodigoSala" placeholder="Ex: SALA_1234" autocomplete="off">
        </div>

        <button id="btnEntrarSala" class="btn-entrar">Entrar na Mesa 🚪</button>
    </div>

    <!-- Caminho corrigido para a pasta js/ -->
    <script src="js/app.js" type="module"></script>
</body>
</html>
